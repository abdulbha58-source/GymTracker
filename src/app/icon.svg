<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <!-- Dumbbell icon -->
  <g stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Bar -->
    <line x1="8" y1="16" x2="24" y2="16"/>
    <!-- Left weight -->
    <rect x="5" y="10" width="5" height="12" rx="1.5" fill="#22c55e" stroke="none"/>
    <!-- Right weight -->
    <rect x="22" y="10" width="5" height="12" rx="1.5" fill="#22c55e" stroke="none"/>
  </g>
</svg>
